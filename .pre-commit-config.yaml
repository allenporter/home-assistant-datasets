---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (?x)^(\.ambr$|datasets/.*|generation/.*|reports/.*|train/.*|docs/.*|model_outputs/.*)
      - id: end-of-file-fixer
        exclude: (?x)^(datasets/.*|generation/.*|reports/.*|train/.*|docs/.*|model_outputs/.*)
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: >
          (?x)^(
              .*/output/.*|
              model_outputs/.*|
              reports/.*|
              models/.*.yaml|
              models.yaml|
              datasets/automations/.*
          )$
      - id: check-added-large-files
        exclude: >
          (?x)^(
              datasets/.*\.jsonl
          )$
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-project ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: ruff format
        entry: uv run --no-project ruff format
        language: system
        types_or:
          - python
          - pyi
      - id: ty
        name: ty check
        entry: uv run --no-project ty check . --ignore unresolved-import
        language: system
        pass_filenames: false
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,chambre,manger,provence,confortable
        exclude: >
          (?x)^(
              .*/output/.*|
              model_outputs/.*|
              reports/.*|
              datasets/.*|
              generation/.*|
              .*\.ipynb|
              datasets/homes.yaml|
              .*/snapshots/.*|
              .*/_fixtures.yaml|
              .*/__snapshots__/.*
          )$
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: >
          (?x)^(
              model_outputs/.*|
              reports/.*|
              datasets/.*|
              generation/.*|
              model_eval/.*/output/.*
          )$
        args:
          - --strict
          - -c
          - ".yaml-lint.yaml"
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        exclude: >
          (?x)^(
              .*/output/.*|
              model_outputs/.*|
              reports/.*|
              datasets/.*|
              generation/.*|
              docs/.*|
              train/.*
          )$
