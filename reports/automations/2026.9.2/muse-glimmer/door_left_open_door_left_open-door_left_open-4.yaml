task:
  input_text: |
    # Door left open

    ## Problem statement

    Create an blueprint automation to play an alert on the speaker when the door is
    left open.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Play an message on the living room speaker if the garage door has been left open for more than 30 minutes
    - When the front door is ajar for 5 minutes, play a sound on the kitchen bluetooth speaker.

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input           | Selector Type | Description                                                                           |
    | --------------- | ------------- | ------------------------------------------------------------------------------------- |
    | `door_sensor`   | `entity`      | A `binary_sensor` entity selector door sensor that is the target of the automation.   |
    | `alert_media`   | `media`       | The target for the `media` selector for the media player and media id with the alter. |
    | `open_duration` | `duration`    | A `duration` selector, the amount of time before playing the alert.                   |

    The automation should play the selected media when the door has been open for the specified duration.
response: |
  Here is a reusable Blueprint automation for the “door left open” use case. It triggers on a binary_sensor door opening, waits for the configured `open_duration` while the door stays open, and then plays the selected media on the chosen media player.

  ```yaml
  blueprint:
    name: Door left open alert
    description: Play an alert on a media player when a door sensor has been open for a specified duration.
    domain: automation
    input:
      door_sensor:
        name: Door sensor
        description: A binary_sensor entity that represents the door. Use a sensor that is `on` when the door is open/ajar.
        selector:
          entity:
            domain: binary_sensor
            device_class: door
      alert_media:
        name: Alert media
        description: Media player and media to play as the alert.
        selector:
          media:
            # Allows selection of media_player + media_id / tts etc.
            # Home Assistant media selector
      open_duration:
        name: Open duration
        description: How long the door must stay open before the alert is played.
        selector:
          duration:

  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: !input door_sensor
      to: 'on'          # door opened
      for: !input open_duration

  condition:
    - condition: state
      entity_id: !input door_sensor
      state: 'on'

  action:
    - variables:
        media_player_entity: "{{ alert_media.split('|')[0] if '|' in alert_media else alert_media }}"
        media_id: "{{ alert_media.split('|')[1] if '|' in alert_media else '' }}"
    - service: media_player.play_media
      target:
        entity_id: "{{ media_player_entity }}"
      data:
        media_content_id: "{{ media_id }}"
        media_content_type: "custom"
    - wait_for_trigger:
        - platform: state
          entity_id: !input door_sensor
          to: 'off'
      timeout: "00:02:00"
      continue_on_timeout: false
  ```

  **How to use**

  1. Save the blueprint in `blueprints/automation/door_left_open_alert.yaml`.
  2. Create an Automation from the blueprint.
  3. Set:
     * `door_sensor` – e.g. `binary_sensor.entry_door`
     * `alert_media` – pick a media player and a media item / TTS message for the alert
     * `open_duration` – e.g. `00:05:00` for 5 minutes, `00:30:00` for 30 minutes

  The automation will play the selected media only if the door remains open for the full duration, and it will be cancelled automatically if the door closes first.
