task:
  input_text: |
    # Vacuum Pause

    ## Problem statement

    Create a blueprint automation to pause the vacuum when I receive a phone call.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Pause the vacuum when I get a phone call from my relatives
    - Don't interrupt my work video convererence call with vacuum noise by pausing it when the call starts

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `phone_call_sensor` | A `binary_sensor` entity that triggers when a phone call is received. |
    | `vacuum_entity`     | A `vacuum` entity to pause when the automation fires.                 |

    The automation should trigger when the binary sensor fires and the vacuum is running. The vacuum
    should be paused (not stopped) and can be resumed manually.
response: |
  Here is a Home Assistant Blueprint you can import for the use case:

  ```yaml
  blueprint:
    name: Pause vacuum on phone call
    description: Pause a vacuum when a phone call binary_sensor triggers, only if the vacuum is running.
    domain: automation
    input:
      phone_call_sensor:
        name: Phone call sensor
        description: A binary_sensor entity that turns on when a phone call is received.
        selector:
          entity:
            domain: binary_sensor
      vacuum_entity:
        name: Vacuum entity
        description: A vacuum entity to pause when the automation fires.
        selector:
          entity:
            domain: vacuum

  trigger:
    - platform: state
      entity_id: !input phone_call_sensor
      from: 'off'
      to: 'on'

  condition:
    - condition: state
      entity_id: !input vacuum_entity
      state: 'cleaning'

  action:
    - service: vacuum.pause
      target:
        entity_id: !input vacuum_entity
      data: {}
  ```

  **How to use**

  1. Save as `pause_vacuum_on_call.yaml` in `blueprints/automation/`.
  2. Create a new Automation → Blueprint → select *Pause vacuum on phone call*.
  3. Set `phone_call_sensor` to your call binary_sensor, e.g. `binary_sensor.phone_call`.
  4. Set `vacuum_entity` to your vacuum, e.g. `vacuum.vacuum_cleaner`.

  The automation triggers on the sensor turning `off` → `on`, checks that the vacuum state is `cleaning`, and then pauses it with `vacuum.pause`. It does not resume automatically.
