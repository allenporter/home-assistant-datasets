task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |
  Here is a Home Assistant Blueprint you can import for "Light on door".

  ```yaml
  blueprint:
    name: Light on door
    description: Turn on a light when a door opens and turn it off when the door closes or after a timeout.
    domain: automation
    input:
      door_sensor:
        name: Door sensor
        description: A binary_sensor that triggers the automation. Use a door/window sensor.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light
        description: One or more light entities to turn on/off when the automation fires.
        selector:
          target:
            entity:
              domain: light
      timeout_minutes:
        name: Timeout minutes
        description: How long to keep the light on after the door opens if it stays open.
        default: 2
        selector:
          number:
            min: 0
            max: 60
            unit_of_measurement: minutes

  variables:
    door_sensor: !input door_sensor
    lights: !input light_switch
    timeout: "{{ (timeout_minutes | int) * 60 }}"

  mode: restart

  trigger:
    - platform: state
      entity_id: !input door_sensor
      to: 'on'
      id: opened
    - platform: state
      entity_id: !input door_sensor
      to: 'off'
      id: closed
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: light_on_door_timer
      id: timeout

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: opened
          sequence:
            - service: light.turn_on
              target: !input light_switch
            - delay: "{{ timeout }}"
            - choose:
                - conditions:
                    - condition: state
                      entity_id: !input door_sensor
                      state: 'on'
                  sequence:
                    - service: light.turn_off
                      target: !input light_switch
        - conditions:
            - condition: trigger
              id: closed
          sequence:
            - service: light.turn_off
              target: !input light_switch
        - conditions:
            - condition: trigger
              id: timeout
          sequence:
            - service: light.turn_off
              target: !input light_switch
  ```

  **How to use it**

  1. Save the blueprint as `light_on_door.yaml` in your `blueprints/automation/` folder.
  2. In Home Assistant go to Settings → Automations & Scenes → Blueprints → Create Automation from Blueprint.
  3. Pick this blueprint and set:
     * **Door sensor**: e.g. `binary_sensor.pantry_door`
     * **Light**: e.g. `light.pantry_light` or select multiple lights
     * **Timeout minutes**: 2

  Example use case you mentioned:
  * Door sensor = Pantry Door `binary_sensor.pantry_door`
  * Light = Pantry Light `light.pantry_light`

  The light will turn on when the pantry door opens, stay on while the door remains open, and turn off when the door closes or after 2 minutes timeout if the door stays open.
