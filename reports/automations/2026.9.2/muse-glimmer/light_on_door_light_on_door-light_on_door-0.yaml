task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |
  Here is a Home Assistant Blueprint you can import for **Light on door**:

  ```yaml
  blueprint:
    name: Light on door
    description: Turn on a light when a door opens and turn it off when the door closes or after a timeout.
    domain: automation
    input:
      door_sensor:
        name: Door sensor
        description: A binary_sensor that triggers the automation. Use a door/window sensor.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light
        description: One or more light entities to turn on/off when the door opens/closes.
        selector:
          target:
            entity:
              domain: light
      timeout:
        name: Timeout
        description: How long to keep the light on after the door closes, in seconds.
        default: 120
        selector:
          number:
            min: 10
            max: 3600
            step: 10
            unit_of_measurement: seconds

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: 'off'
      to: 'on'
    - platform: state
      entity_id: !input door_sensor
      from: 'on'
      to: 'off'

  variables:
    lights: !input light_switch
    door: !input door_sensor
    timeout: !input timeout

  action:
    - choose:
        # Door opened -> turn on immediately
        - conditions:
            - condition: trigger
              platform: state
              entity_id: "{{ door }}"
              from: 'off'
              to: 'on'
          sequence:
            - service: light.turn_on
              target: "{{ lights }}"
            - wait_for_trigger:
                - platform: state
                  entity_id: "{{ door }}"
                  from: 'on'
                  to: 'off'
              timeout: "{{ timeout }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  sequence:
                    - delay: "{{ timeout }}"
                - conditions: []
                  sequence:
                    - delay: 00:00:01
            - service: light.turn_off
              target: "{{ lights }}"
      default: []
  ```

  **How to use**

  1. Save as `light_on_door.yaml` in your `blueprints/automation/` folder.
  2. Create a new automation from the UI → Blueprints → Light on door.
  3. Set `door_sensor` to your binary_sensor, e.g. `binary_sensor.pantry_door`.
  4. Set `light_switch` to the light(s) you want to control, e.g. `light.pantry_light`.

  Behavior:
  * Door opens → light turns on immediately.
  * Light stays on while door is open.
  * When door closes, light stays on for 2 minutes `timeout` then turns off.
  * If the door re-opens before timeout, the timer resets via the new trigger.

  Want me to adapt it for a specific door/light in your home, e.g. Pantry Door + Pantry Light?
