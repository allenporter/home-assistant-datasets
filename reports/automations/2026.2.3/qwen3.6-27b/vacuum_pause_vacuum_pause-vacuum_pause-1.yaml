task:
  input_text: |
    # Vacuum Pause

    ## Problem statement

    Create a blueprint automation to pause the vacuum when I receive a phone call.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Pause the vacuum when I get a phone call from my relatives
    - Don't interrupt my work video convererence call with vacuum noise by pausing it when the call starts

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `phone_call_sensor` | A `binary_sensor` entity that triggers when a phone call is received. |
    | `vacuum_entity`     | A `vacuum` entity to pause when the automation fires.                 |

    The automation should trigger when the binary sensor fires and the vacuum is running. The vacuum
    should be paused (not stopped) and can be resumed manually.
response: |-
  Here is the Home Assistant blueprint for pausing the vacuum during a phone call.

  ```yaml
  blueprint:
    name: Pause Vacuum on Phone Call
    description: >
      Pauses the vacuum when a phone call is received.
      The vacuum can be resumed manually.
    domain: automation
    input:
      phone_call_sensor:
        name: Phone Call Sensor
        description: >
          A binary_sensor that turns 'on' when a phone call is received.
        selector:
          entity:
            domain: binary_sensor
      vacuum_entity:
        name: Vacuum
        description: >
          The vacuum entity to pause.
        selector:
          entity:
            domain: vacuum

  variables:
    phone_call_sensor: !input phone_call_sensor
    vacuum_entity: !input vacuum_entity

  trigger:
    - platform: state
      entity_id: !input phone_call_sensor
      to: "on"

  condition:
    - condition: state
      entity_id: !input vacuum_entity
      state: "cleaning"

  action:
    - service: vacuum.pause
      target:
        entity_id: !input vacuum_entity
      data: {}
  ```

  ### How to use:
  1. Go to **Settings** > **Automations & Scenes** > **Blueprints**.
  2. Click **Create Blueprint** and paste the code above.
  3. Create a new automation using this blueprint.
  4. Select your phone call binary sensor (e.g., from a phone companion app or Home Assistant mobile integration) and your vacuum entity.
  5. The automation will only trigger if the sensor turns `on` AND the vacuum is currently `cleaning`. It will send the `pause` command, keeping the vacuum in place until you manually resume it.
