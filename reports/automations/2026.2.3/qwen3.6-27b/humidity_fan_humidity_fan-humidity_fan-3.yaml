task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: |-
  Here is the Home Assistant blueprint for controlling a fan based on humidity levels.

  ```yaml
  blueprint:
    name: Humidity Fan Control
    description: Turn on a fan when humidity exceeds a threshold, and turn it off when it drops below.
    domain: automation
    input:
      humidity_sensor:
        name: Humidity Sensor
        description: The sensor entity that measures humidity.
        selector:
          entity:
            domain: sensor
            device_class: humidity
      humidity_level:
        name: Humidity Threshold
        description: The humidity percentage above which the fan turns on.
        selector:
          number:
            min: 0
            max: 100
            unit_of_measurement: "%"
            mode: box
      fan_entity:
        name: Fan Entity
        description: The fan to control.
        selector:
          entity:
            domain: fan

  variables:
    sensor_entity: !input humidity_sensor
    threshold: !input humidity_level
    fan: !input fan_entity

  trigger:
    - platform: numeric_state
      entity_id: !input humidity_sensor
      above: !input humidity_level
    - platform: numeric_state
      entity_id: !input humidity_sensor
      below: !input humidity_level

  condition:
    # Condition is handled within actions via state checks to prevent redundant commands

  action:
    - choose:
        # Turn fan ON if humidity went above threshold and fan is currently OFF
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state | float > threshold }}"
            - condition: state
              entity_id: !input fan_entity
              state: "off"
          sequence:
            - service: fan.turn_on
              target:
                entity_id: !input fan_entity
            - service: persistent_notification.create
              data:
                title: Humidity Fan
                message: "Fan turned on due to high humidity ({{ states(sensor_entity) | round(1) }}%)."

        # Turn fan OFF if humidity went below threshold and fan is currently ON
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state | float <= threshold }}"
            - condition: state
              entity_id: !input fan_entity
              state: "on"
          sequence:
            - service: fan.turn_off
              target:
                entity_id: !input fan_entity
            - service: persistent_notification.create
              data:
                title: Humidity Fan
                message: "Fan turned off as humidity dropped ({{ states(sensor_entity) | round(1) }}%)."

      default:
        # Do nothing if the fan is already in the desired state
        - service: persistent_notification.create
          data:
            title: Humidity Fan
            message: "No action taken. Fan is already in the correct state."
  ```

  ### How to use:
  1. Go to **Settings** > **Automations & Scenes**.
  2. Click **Create Automation** > **Choose Blueprint**.
  3. Select **Humidity Fan Control** (you may need to import the YAML code above into your `blueprints` folder first).
  4. Enter your humidity sensor, desired threshold (e.g., 60), and the fan entity.
  5. Save.
