task:
  input_text: |
    # Vacuum Pause

    ## Problem statement

    Create a blueprint automation to pause the vacuum when I receive a phone call.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Pause the vacuum when I get a phone call from my relatives
    - Don't interrupt my work video convererence call with vacuum noise by pausing it when the call starts

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `phone_call_sensor` | A `binary_sensor` entity that triggers when a phone call is received. |
    | `vacuum_entity`     | A `vacuum` entity to pause when the automation fires.                 |

    The automation should trigger when the binary sensor fires and the vacuum is running. The vacuum
    should be paused (not stopped) and can be resumed manually.
response: "Here is the Home Assistant blueprint for pausing the vacuum when a phone\
  \ call is received.\n\n```yaml\nblueprint:\n  name: Pause Vacuum on Phone Call\n\
  \  description: >\n    Automatically pauses the vacuum cleaner when a phone call\
  \ is detected, \n    allowing you to resume it manually after the call ends.\n \
  \ domain: automation\n  input:\n    phone_call_sensor:\n      name: Phone Call Sensor\n\
  \      description: >\n        A binary_sensor that turns 'on' when you are on a\
  \ phone call.\n      selector:\n        entity:\n          domain: binary_sensor\n\
  \    vacuum_entity:\n      name: Vacuum Entity\n      description: >\n        The\
  \ vacuum cleaner entity to pause.\n      selector:\n        entity:\n          domain:\
  \ vacuum\n\nvariables:\n  call_sensor: !input phone_call_sensor\n  vac_entity: !input\
  \ vacuum_entity\n\ntrigger:\n  - platform: state\n    entity_id: !input phone_call_sensor\n\
  \    to: \"on\"\n\ncondition:\n  - condition: state\n    entity_id: !input vacuum_entity\n\
  \    state_not:\n      - \"off\"\n      - \"docked\"\n      - \"error\"\n      -\
  \ \"not_home\"\n\naction:\n  - service: vacuum.pause\n    target:\n      entity_id:\
  \ !input vacuum_entity\n    data: {}\n```\n\n### How to use this blueprint:\n\n\
  1.  **Create the Blueprint:**\n    - Go to **Settings** > **Devices & Services**\
  \ > **Blueprints**.\n    - Click **Create Blueprint** (or import via YAML).\n  \
  \  - Paste the code above and save it with the name \"Pause Vacuum on Phone Call\"\
  .\n\n2.  **Add the Sensor:**\n    - Ensure you have a `binary_sensor` that turns\
  \ `on` when you are on a call. This is often provided by integrations like:\n  \
  \    - **Home Assistant Cloud** (if using Assist)\n      - **Call Log** integrations\n\
  \      - **Custom sensors** from apps like Tasker or Node-RED\n      - **Phone State**\
  \ integrations (e.g., from Android apps like \"Tasker\" or \"Automate\")\n\n3. \
  \ **Create the Automation:**\n    - Go to **Settings** > **Automations & Scenes**.\n\
  \    - Click **Create Automation** > **Choose Blueprint**.\n    - Select \"Pause\
  \ Vacuum on Phone Call\".\n    - Select your **Phone Call Sensor** and **Vacuum\
  \ Entity**.\n    - Save the automation.\n\n### Notes:\n- The automation only triggers\
  \ if the vacuum is in a running state (not docked, off, or in error).\n- The vacuum\
  \ will be **paused**, not stopped. You can manually resume it via the Lovelace UI\
  \ or voice command after the call ends.\n- If you want the vacuum to **automatically\
  \ resume** after the call ends, you would need to add a second trigger for the sensor\
  \ turning `off` and an action to `vacuum.start`. Let me know if you'd like that\
  \ version."
