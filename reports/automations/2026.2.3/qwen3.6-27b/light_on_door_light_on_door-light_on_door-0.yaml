    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: "Here is the YAML for the Home Assistant blueprint.\n\n```yaml\nblueprint:\n\
  \  name: Light on Door Open\n  description: Turn on a light when a door opens, turn\
  \ it off when it closes or after a timeout.\n  domain: automation\n  input:\n  \
  \  door_sensor:\n      name: Door Sensor\n      description: The binary sensor for\
  \ the door.\n      selector:\n        entity:\n          domain: binary_sensor\n\
  \          device_class: door\n    light_switch:\n      name: Light\n      description:\
  \ The light(s) to turn on.\n      selector:\n        target:\n          entity:\n\
  \            domain: light\n\nvariables:\n  door_sensor: !input door_sensor\n  light_targets:\
  \ !input light_switch\n\ntrigger:\n  - platform: state\n    entity_id: !input door_sensor\n\
  \    to: \"on\"\n\naction:\n  - service: light.turn_on\n    target: !input light_switch\n\
  \nmode: restart\n\n# Note: The requirement to turn off on close OR timeout is best\
  \ handled by \n# a secondary automation or a wait_template in the action. \n# However,\
  \ standard blueprints often keep it simple. \n# To strictly follow \"turn off when\
  \ door closes OR 2 min timeout\", \n# we can use a sequence with wait_template and\
  \ a timeout.\n\n# Revised Action to handle both conditions cleanly within one automation\
  \ run:\n# Actually, the 'mode: restart' above handles the 'on' part. \n# To handle\
  \ the 'off' part based on close OR timeout, we should use a different approach.\n\
  # Let's use a single automation that triggers on open, turns light on, then waits.\n\
  \n# Corrected Implementation:\n# Trigger on open. Turn light on. Then wait for close\
  \ or timeout.\n\n# Re-writing the automation part for correctness:\n\n# Trigger\n\
  trigger:\n  - platform: state\n    entity_id: !input door_sensor\n    to: \"on\"\
  \n\n# Action\naction:\n  - service: light.turn_on\n    target: !input light_switch\n\
  \  - wait_template: \"{{ is_state(door_sensor, 'off') }}\"\n    timeout: \"00:02:00\"\
  \n    continue_on_timeout: true\n  - service: light.turn_off\n    target: !input\
  \ light_switch\n\nmode: single\n```\n\n**Correction:** The previous block had mixed\
