task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  Here is the YAML code for the Home Assistant Blueprint.

  ```yaml
  blueprint:
    name: Turn on light when door opens
    description: >
      Turns on a light when a door opens and turns it off when the door closes
      or after a timeout.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: The binary sensor for the door.
        selector:
          entity:
            domain: binary_sensor
            device_class: door
      light_switch:
        name: Light
        description: The light to turn on.
        selector:
          entity:
            domain: light

  variables:
    door_sensor: !input door_sensor
    light_switch: !input light_switch

  trigger:
    - platform: state
      entity_id: !input door_sensor
      to: "on"

  action:
    - service: light.turn_on
      target:
        entity_id: !input light_switch

  mode: single

  # Note: The requirement "shut off when door closes OR after 2 minute timeout"
  # is best handled by a wait_template or a separate timeout trigger.
  # However, standard blueprints often use a simple timeout.
  # To satisfy "door closes OR timeout", we use a wait_template with a timeout.
  # But wait_template blocks the action. A better approach for "turn off" is
  # to use a trigger-based automation or complex action.
  # Given the simplicity requested, here is a robust approach using a wait template
  # that waits for the door to close, but times out after 2 minutes.
  # If the door closes first, the wait ends. If 2 mins pass, the wait ends.
  # Then we turn off the light.

  # Correction: The previous action turned the light ON.
  # We need to turn it OFF after the condition is met.

  # Let's restructure the action block to include the wait and turn off.

  action:
    - service: light.turn_on
      target:
        entity_id: !input light_switch
    - wait_template: "{{ is_state(door_sensor, 'off') }}"
      timeout: "00:02:00"
      continue_on_timeout: true
    - service: light.turn_off
      target:
        entity_id: !input light_switch
  ```

  **Explanation:**
  1.  **Trigger:** The automation starts when the `door_sensor` state changes to `on` (open).
  2.  **Action 1:** It immediately turns the `light_switch` on.
  3.  **Action 2:** It waits for the `door_sensor` to return to `off` (closed).
  4.  **Timeout:** If the door does not close within 2 minutes (`00:02:00`), the wait continues due to `continue_on_timeout: true`.
  5.  **Action 3:** Once the wait is over (either because the door closed or the timeout hit), it turns the `light_switch` off.
