task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  ```yaml
  blueprint:
    name: Light on Door
    description: Turn on a light when the door opens, and turn it off when the door closes or after a timeout.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: The binary sensor that detects when the door opens/closes.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light Target(s)
        description: The light entity or list of entities to turn on.
        selector:
          target:
            entity:
              domain: light
      timeout:
        name: Timeout
        description: Time to wait before turning off the light if the door remains open.
        default: "00:02:00"
        selector:
          duration:

  trigger:
    # Trigger when the door opens
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"
    # Trigger when the door closes (to potentially cancel timeout or turn off immediately)
    - platform: state
      entity_id: !input door_sensor
      from: "on"
      to: "off"

  action:
    - choose:
        # Case 1: Door opened
        - conditions:
            - condition: trigger
              id:
                - "0"
          sequence:
            - service: light.turn_on
              target: !input light_switch

        # Case 2: Door closed
        - conditions:
            - condition: trigger
              id:
                - "1"
          sequence:
            # Cancel any existing delay
            - delay:
                milliseconds: 0
            - service: light.turn_off
              target: !input light_switch

    # If door opened, start a timeout to turn off the light later
    - wait_for_trigger:
        - platform: state
          entity_id: !input door_sensor
          from: "on"
          to: "off"
      timeout: !input timeout
      continue_on_timeout: true

    - service: light.turn_off
      target: !input light_switch
  ```
