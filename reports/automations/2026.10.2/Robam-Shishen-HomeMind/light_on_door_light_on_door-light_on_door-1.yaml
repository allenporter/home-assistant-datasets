task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  ```yaml
  blueprint:
    name: Light on Door Open
    description: Turn on a light when the door opens, and turn it off when the door closes or after a timeout.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        selector:
          entity:
            integration: homeassistant
            domain: binary_sensor
            device_class: door
      light_switch:
        name: Light Switch
        selector:
          target:
            entity:
              domain: light

  trigger:
    # Trigger when the door opens
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"

  action:
    # Turn on the light immediately
    - service: light.turn_on
      target: !input light_switch

    # Wait for the door to close OR wait for 2 minutes (whichever happens first)
    - wait_for_trigger:
        - platform: state
          entity_id: !input door_sensor
          from: "on"
          to: "off"
      timeout: "00:02:00"

    # Turn off the light after the door closes or after the timeout
    - service: light.turn_off
      target: !input light_switch

  mode: restart
  ```
