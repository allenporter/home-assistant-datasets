task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  ```yaml
  blueprint:
    name: Light on Door
    description: Turns on a light when the door opens and turns it off after a timeout or when the door closes.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: The binary sensor that detects if the door is open or closed.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light Switch
        description: The light(s) to turn on when the door opens.
        selector:
          target:
            entity:
              domain: light

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"
      id: door_opened

  action:
    - service: light.turn_on
      target: !input light_switch

    - wait_for_trigger:
        - platform: state
          entity_id: !input door_sensor
          from: "on"
          to: "off"
          id: door_closed
        - platform: homeassistant
          event: stop
          id: automation_stopped
        - platform: numeric_state
          entity_id: !input door_sensor
          above: 0
          for:
            minutes: 2
          id: timeout
      continue_on_timeout: false

    - choose:
        - conditions:
            - condition: trigger
              id:
                - door_closed
                - automation_stopped
          sequence:
            - service: light.turn_off
              target: !input light_switch
        - conditions:
            - condition: trigger
              id: timeout
          sequence:
            - service: light.turn_off
              target: !input light_switch

  mode: restart
  ```
