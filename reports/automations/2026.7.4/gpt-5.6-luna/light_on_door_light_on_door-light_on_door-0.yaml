task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  ```yaml
  blueprint:
    name: Light on door
    description: Turn on one or more lights when a door opens, then turn them off when the door closes or after two minutes.
    domain: automation
    input:
      door_sensor:
        name: Door sensor
        description: The binary sensor that detects when the door opens.
        selector:
          entity:
            domain: binary_sensor

      light_switch:
        name: Light(s)
        description: The light or lights to turn on and off.
        selector:
          target:
            entity:
              domain: light

  trigger:
    - platform: state
      entity_id: !input door_sensor
      to: "on"

  action:
    - service: light.turn_on
      target: !input light_switch

    - wait_for_trigger:
        - platform: state
          entity_id: !input door_sensor
          to: "off"
      timeout: "00:02:00"
      continue_on_timeout: true

    - service: light.turn_off
      target: !input light_switch

  mode: restart
  ```

  Save it as, for example:

  ```text
  config/blueprints/automation/light_on_door.yaml
  ```

  Then reload automations and create an automation from the blueprint.
