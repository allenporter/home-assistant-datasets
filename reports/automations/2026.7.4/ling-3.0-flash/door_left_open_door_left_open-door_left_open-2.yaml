task:
  input_text: |
    # Door left open

    ## Problem statement

    Create an blueprint automation to play an alert on the speaker when the door is
    left open.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Play an message on the living room speaker if the garage door has been left open for more than 30 minutes
    - When the front door is ajar for 5 minutes, play a sound on the kitchen bluetooth speaker.

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input           | Selector Type | Description                                                                           |
    | --------------- | ------------- | ------------------------------------------------------------------------------------- |
    | `door_sensor`   | `entity`      | A `binary_sensor` entity selector door sensor that is the target of the automation.   |
    | `alert_media`   | `media`       | The target for the `media` selector for the media player and media id with the alter. |
    | `open_duration` | `duration`    | A `duration` selector, the amount of time before playing the alert.                   |

    The automation should play the selected media when the door has been open for the specified duration.
response: |-
  Here's a YAML blueprint automation for your door left open alert:

  ```yaml
  blueprint:
    name: Door Left Open Alert
    description: >
      Play an alert on a media player when a door has been left open
      for a specified duration.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: The binary sensor representing the door
        selector:
          entity:
            domain: binary_sensor
            device_class: door
      alert_media:
        name: Alert Media
        description: The media player and alert sound to play
        selector:
          media: {}
      open_duration:
        name: Open Duration
        description: Duration the door must be open before playing the alert
        selector:
          duration: {}

  trigger:
    - platform: state
      entity_id: !input door_sensor
      to: "on"

  mode: restart

  action:
    - alias: "Wait for door to close or timeout"
      wait_for_trigger:
        - platform: state
          entity_id: !input door_sensor
          to: "off"
      timeout: !input open_duration
      continue_on_timeout: true

    - alias: "Check door is still open"
      condition: state
      entity_id: !input door_sensor
      state: "on"

    - alias: "Play alert media"
      service: media_player.play_media
      target:
        entity_id: "{{ alert_media.entity_id }}"
      data:
        media_content_id: "{{ alert_media.media_content_id }}"
        media_content_type: "music"
  ```

  **How it works:**

  1. **Trigger** — Fires when the door sensor changes to "on" (door opens).
  2. **Wait** — Waits for the specified duration. If the door closes during this time, the automation cancels automatically.
  3. **Condition** — After the timeout, verifies the door is still open (in case it was closed and reopened).
  4. **Action** — Plays the selected alert media on the chosen speaker.

  **Usage examples:**

  - **Garage door alert**: Select the garage door binary sensor, choose the living room speaker, set duration to 30 minutes.
  - **Front door alert**: Select the front door binary sensor, choose the kitchen media player, set duration to 5 minutes.

  The `mode: restart` ensures that if the door is opened again while an alert is pending, the timer resets from scratch.
