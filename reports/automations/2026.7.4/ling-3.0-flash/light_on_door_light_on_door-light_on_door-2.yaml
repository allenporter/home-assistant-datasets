task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  Here's the blueprint automation YAML:

  ```yaml
  blueprint:
    name: Light on Door Open
    description: Turn on a light when a door opens, and turn it off when the door closes or after a 2-minute timeout.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: A binary sensor that triggers the automation when the door opens.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light
        description: The light(s) to turn on when the door opens.
        selector:
          target:
            entity:
              domain: light

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"
    - platform: state
      entity_id: !input door_sensor
      from: "on"
      to: "off"

  action:
    - choose:
        - conditions:
            - alias: "Door Opened"
              condition: trigger
              id: "0"
          sequence:
            - alias: "Turn on the light"
              action: light.turn_on
              target:
                entity_id: !input light_switch
            - alias: "Wait 2 minutes then turn off the light"
              action: delay
              delay:
                minutes: 2
              continue_on_timeout: false
            - alias: "Turn off the light after timeout"
              action: light.turn_off
              target:
                entity_id: !input light_switch
              condition:
                - condition: state
                  entity_id: !input door_sensor
                  state: "on"
        - conditions:
            - alias: "Door Closed"
              condition: trigger
              id: "1"
          sequence:
            - alias: "Turn off the light"
              action: light.turn_off
              target:
                entity_id: !input light_switch
  mode: restart
  ```

  **How it works:**

  1. **Door opens** (binary_sensor goes from `off` to `on`): The light turns on immediately, and a 2-minute delay starts. If the door is still open after 2 minutes, the light turns off automatically.

  2. **Door closes** (binary_sensor goes from `on` to `off`): The light turns off immediately, and any pending 2-minute delay is cancelled.

  3. **`mode: restart`** ensures that if the door opens again while the automation is running, it restarts cleanly — cancelling any old delay and starting fresh.

  You can use this blueprint directly in Home Assistant by creating a new automation and selecting this blueprint. Then configure the `door_sensor` (e.g., Pantry Door) and `light_switch` (e.g., Pantry Light) for your specific use case.
