task:
  input_text: |
    # Humidity Fan

    ## Problem statement

    Create a blueprint automation to turn on the fan based on the value of the humidity sensor.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the bathroom exhaust fan when the bathroom humidty is above 60%
    - Make sure the garage does not get too humid

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input               | Description                                                           |
    | ------------------- | --------------------------------------------------------------------- |
    | `humidity_sensor` | A `sensor` entity that is a humidty sensor that triggers the automation. |
    | `humidity_level` | A `number` selector to set the value used as the trigger. |
    | `fan_entity`     | A `fan` entity to turn on when the automation fires. |

    The automation should trigger when the `humidity_sensor` level goes above `humidity_level`. When
    triggered, the fan should be turned off. The fan should also be stopped when the
    sensor goes back down below the desired level. The automation should not try to
    turn the fan on if it is already on, and should not turn the fan off when it is
    already off.
response: |-
  Here is the blueprint YAML for the Humidity Fan automation:

  ```yaml
  blueprint:
    name: Humidity Fan
    description: Turns on a fan when humidity exceeds a threshold, and turns it off when it drops below.
    input:
      humidity_sensor:
        name: Humidity Sensor
        description: A sensor entity that is a humidity sensor that triggers the automation.
        selector:
          entity:
            domain: sensor
      humidity_level:
        name: Humidity Level
        description: The humidity threshold used to trigger the automation.
        selector:
          number:
            min: 0
            max: 100
            unit_of_measurement: "%"
            mode: slider
      fan_entity:
        name: Fan Entity
        description: A fan entity to turn on when the humidity is above the threshold.
        selector:
          entity:
            domain: fan

  trigger:
    - platform: numeric_state
      entity_id: !input humidity_sensor
      above: !input humidity_level
      id: humidity_above
    - platform: numeric_state
      entity_id: !input humidity_sensor
      below: !input humidity_level
      id: humidity_below

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: humidity_above
          sequence:
            - condition: not
              conditions:
                - condition: state
                  entity_id: !input fan_entity
                  state: "on"
            - service: fan.turn_on
              target:
                entity_id: !input fan_entity
        - conditions:
            - condition: trigger
              id: humidity_below
          sequence:
            - condition: not
              conditions:
                - condition: state
                  entity_id: !input fan_entity
                  state: "off"
            - service: fan.turn_off
              target:
                entity_id: !input fan_entity
  ```

  **How it works:**

  1. **Inputs** — The blueprint accepts three inputs matching your specification: a humidity sensor, a numeric humidity threshold, and a fan entity.

  2. **Triggers** — Two `numeric_state` triggers fire when the sensor crosses the threshold:
     - `humidity_above` fires when the sensor goes **above** the threshold.
     - `humidity_below` fires when the sensor goes **below** the threshold.

  3. **Actions with conditions** — A `choose` block uses the `trigger` condition to distinguish which trigger fired. Each branch includes a `not` condition so that:
     - The fan is **only turned on** if it isn't already on.
     - The fan is **only turned off** if it isn't already off.

  You can import this blueprint into Home Assistant by adding it as a new automation from the UI (YAML mode) or via **Settings → Automations & Scenes → Blueprints**.
