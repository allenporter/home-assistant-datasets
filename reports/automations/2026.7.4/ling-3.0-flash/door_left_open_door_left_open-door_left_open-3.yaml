task:
  input_text: |
    # Door left open

    ## Problem statement

    Create an blueprint automation to play an alert on the speaker when the door is
    left open.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Play an message on the living room speaker if the garage door has been left open for more than 30 minutes
    - When the front door is ajar for 5 minutes, play a sound on the kitchen bluetooth speaker.

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input           | Selector Type | Description                                                                           |
    | --------------- | ------------- | ------------------------------------------------------------------------------------- |
    | `door_sensor`   | `entity`      | A `binary_sensor` entity selector door sensor that is the target of the automation.   |
    | `alert_media`   | `media`       | The target for the `media` selector for the media player and media id with the alter. |
    | `open_duration` | `duration`    | A `duration` selector, the amount of time before playing the alert.                   |

    The automation should play the selected media when the door has been open for the specified duration.
response: |-
  Here's the blueprint automation YAML for playing an alert when a door is left open:

  ```yaml
  blueprint:
    name: Door Left Open Alert
    description: >
      Play an alert on a speaker when a door has been left open
      for a specified duration.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: The binary sensor that detects whether the door is open.
        selector:
          entity:
            domain: binary_sensor
      alert_media:
        name: Alert Media Player
        description: The media player to play the alert sound on.
        selector:
          target:
            entity:
              domain: media_player
      alert_media_id:
        name: Alert Media ID
        description: The media content ID or URL of the alert to play.
        selector:
          text:
      open_duration:
        name: Open Duration
        description: The amount of time the door must remain open before the alert plays.
        selector:
          duration:

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"

  action:
    - delay: !input open_duration
    - condition: state
      entity_id: !input door_sensor
      state: "on"
    - service: media_player.play_media
      target: !input alert_media
      data:
        media_content_id: !input alert_media_id
        media_content_type: music
  ```

  **How it works:**

  1. **Trigger** — Fires when the door sensor changes from `off` to `on` (door opens).
  2. **Delay** — Waits for the specified duration (e.g., `00:05:00` for 5 minutes).
  3. **Condition** — Checks the door is *still* open after the wait. If it has closed, nothing happens.
  4. **Action** — Plays the selected alert media on the chosen speaker.

  **Example use in the UI:**
  - Door sensor: `binary_sensor.garage_door`
  - Alert media: `media_player.living_room_speaker`
  - Alert media ID: `https://example.com/door_left_open.mp3`
  - Open duration: `00:30:00`
