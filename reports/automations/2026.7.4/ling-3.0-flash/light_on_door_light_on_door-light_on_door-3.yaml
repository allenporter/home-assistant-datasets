task:
  input_text: |
    # Light on door

    ## Problem statement

    Create an blueprint automation to turn on a light when the door opens.

    ## Example use cases

    These are example use cases that could be used with the blueprint:

    - Turn on the pantry light when the pantry door opens

    ## Detailed Description

    The blueprint should accept two inputs:

    | Input          | Description                                                                     |
    | -------------- | ------------------------------------------------------------------------------- |
    | `door_sensor`  | A `binary_sensor` that triggers the automation to start.                        |
    | `light_switch` | One or more `light` entity targets to turn on or off when the automation fires. |

    The automation should trigger when the door opens, and turn the light on. The
    light should be shut off when the door closes or after a 2 minute timeout.
response: |-
  Here's the blueprint automation YAML:

  ```yaml
  blueprint:
    name: Light on Door Open
    description: Turns on a light when a door opens and turns it off when the door closes or after a 2-minute timeout.
    domain: automation
    input:
      door_sensor:
        name: Door Sensor
        description: A binary_sensor that triggers the automation when the door opens.
        selector:
          entity:
            domain: binary_sensor
      light_switch:
        name: Light
        description: One or more light entities to turn on when the door opens.
        selector:
          target:
            entity:
              domain: light

  trigger:
    - platform: state
      entity_id: !input door_sensor
      from: "off"
      to: "on"

  condition: []

  action:
    - choose:
        - conditions:
            - condition: triggers
              id: door_open
          sequence:
            # Turn on the light(s)
            - action: light.turn_on
              target:
                entity_id: !input light_switch

            # Wait for either the door to close or a 2-minute timeout
            - wait_for_trigger:
                - platform: state
                  entity_id: !input door_sensor
                  from: "on"
                  to: "off"
              timeout:
                minutes: 2

            # Turn off the light(s) after door closes or timeout
            - action: light.turn_off
              target:
                entity_id: !input light_switch

  mode: restart
  max_exceeded: silent
  ```

  **How it works:**

  1. **Trigger** — Fires when the door sensor changes from `off` to `on`.
  2. **Action** — Turns the light on.
  3. **Wait** — Pauses and waits for either the door sensor to go back to `off` (door closes) or a 2-minute timeout, whichever comes first.
  4. **After wait** — Turns the light off.

  **Example usage** — to turn on the pantry light when the pantry door opens, you'd select your pantry door binary sensor as the `door_sensor` and the pantry light as the `light_switch`.

  You can add this blueprint to your Home Assistant by going to **Settings → Automations & Scenes → Blueprints** and importing the YAML.
