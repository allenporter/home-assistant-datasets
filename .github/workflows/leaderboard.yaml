---
name: Update Leaderboard

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - "models/**"
      - "datasets/**"
      - "home_assistant_datasets/tool/leaderboard/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "leaderboard"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "requirements_dev.txt"
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -r requirements_dev.txt -e . --prerelease=allow

      - name: Build Leaderboard
        run: |
          home-assistant-datasets leaderboard build

      - name: Commit and push changes
        run: |
          if ! git diff --quiet reports/README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reports/README.md
            git commit -m "Auto-update leaderboard [skip ci]"
            git push
          else
            echo "Leaderboard is up to date, nothing to commit."
          fi
